name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc-c++ \
            cmake \
            ninja-build \
            extra-cmake-modules \
            qt6-qtbase-devel \
            kf6-kcoreaddons-devel \
            kf6-kio-devel \
            plasma-workspace-devel \
            kdeplasma-addons-devel

      - name: Configure
        run: |
          cmake -B build -G Ninja -DBUILD_TESTING=ON

      - name: Build
        run: |
          cmake --build build

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure